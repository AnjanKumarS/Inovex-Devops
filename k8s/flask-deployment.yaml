apiVersion: apps/v1
kind: Deployment
metadata:
  name: inovex-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inovex-app
  template:
    metadata:
      labels:
        app: inovex-app
    spec:
      containers:
      - name: inovex-container
        image: inovex-app:latest
        imagePullPolicy: Never  # <<< CRUCIAL for local Docker image
        ports:
        - containerPort: 5000
